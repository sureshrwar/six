name: SIX Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            e2fsprogs \
            fakeroot \
            ntfs-3g

      - name: Build SIX
        run: make

      - name: Smoke test
        run: |
          ./six --help
          ./scripts/run_guest_cmd.py "uname -a" "dmsetup status" "df -h"
